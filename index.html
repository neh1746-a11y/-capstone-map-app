<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공안전·편의시설 통합 지도 플랫폼</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=02e34163205d82cea0216f8d689284bf&libraries=services,clusterer"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#f4f6f9}

.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;box-shadow:0 2px 10px #00000014;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:800;color:#1e293b}
.badge-count{font-size:12px;background:#eff6ff;color:#2563eb;padding:3px 8px;border-radius:999px}
.search-box{display:flex;gap:6px;flex:1;max-width:420px}
.search-box input{flex:1;min-width:120px;padding:7px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
.btn{padding:7px 12px;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:#2563eb;color:#fff}
.btn-dark{background:#1e293b;color:#fff}
.btn-outline{background:#f1f5f9;color:#334155}

.filter-row{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-x:auto}
.chips{display:flex;gap:6px}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;border:1px solid #cbd5e1;background:#fff;color:#475569;white-space:nowrap}
.chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
.status-select{padding:5px 10px;border-radius:8px;border:1px solid #cbd5e1}

#map{position:absolute;top:104px;left:0;right:0;bottom:0;background:#e5e7eb}

.detail-panel{position:fixed;right:16px;bottom:16px;width:350px;max-width:calc(100% - 32px);max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 10px 25px #00000026;padding:18px;z-index:30;display:none;flex-direction:column;gap:12px}
.detail-panel.open{display:flex}
.detail-title{font-size:16px;font-weight:700;color:#0f172a}
.detail-addr{font-size:13px;color:#475569}
.detail-coord{font-size:11px;color:#94a3b8}
.detail-cat{font-size:11px;color:#2563eb}
.close-btn{background:none;border:0;font-size:18px}
.status-group{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-btn{padding:7px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
.st-btn.active{background:#dbeafe;border-color:#2563eb}
.note-input{width:100%;height:64px;padding:8px;border:1px solid #cbd5e1;border-radius:8px}
.detail-actions{display:flex;gap:8px}
.detail-actions .btn{flex:1;text-align:center;text-decoration:none}

.add-banner{position:fixed;top:112px;left:50%;transform:translateX(-50%);z-index:25;background:#1e293b;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;display:none;white-space:nowrap}

.modal-backdrop{position:fixed;inset:0;background:#0f172a80;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal{background:#fff;width:100%;max-width:380px;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600}
.field input,.field select{padding:8px;border:1px solid #cbd5e1;border-radius:8px}

@media(max-width:700px){
.topbar{padding:8px;gap:6px}
.brand{font-size:14px}
.topbar-row{justify-content:flex-start}
.search-box{order:3;max-width:none;flex-basis:100%}
#map{top:142px}
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      📍 공공안전·편의시설 맵
      <span class="badge-count" id="countBadge">지도 준비 중...</span>
    </div>

    <div class="search-box">
      <input id="searchInput" placeholder="지역명 또는 시설명 검색"
        onkeyup="if(event.key==='Enter')handleSearch()">
      <button class="btn btn-primary" onclick="handleSearch()">검색</button>
    </div>

    <div style="display:flex;gap:6px">
      <button class="btn btn-outline" onclick="moveToCurrentLocation()">내 위치</button>
      <button class="btn btn-dark" id="addModeBtn" onclick="toggleAddMode()">+ 시설 등록</button>
    </div>
  </div>

  <div class="filter-row">
    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="ALL" onclick="selectCategory(this)">전체</button>
      <button class="chip" data-cat="공중화장실" onclick="selectCategory(this)">공중화장실</button>
      <button class="chip" data-cat="AED" onclick="selectCategory(this)">AED</button>
      <button class="chip" data-cat="졸음쉼터" onclick="selectCategory(this)">졸음쉼터</button>
      <button class="chip" data-cat="한파쉼터" onclick="selectCategory(this)">한파쉼터</button>
      <button class="chip" data-cat="무더위쉼터" onclick="selectCategory(this)">무더위쉼터</button>
    </div>

    <select class="status-select" id="statusFilter" onchange="fetchLocations()">
      <option value="ALL">전체 상태</option>
      <option value="PENDING">미검수</option>
      <option value="VERIFIED">검수완료</option>
      <option value="INVALID">불일치/폐쇄</option>
    </select>
  </div>
</div>

<div class="add-banner" id="addBanner">
지도에서 신규 시설을 등록할 위치를 클릭하세요
</div>

<div id="map"></div>

<div class="detail-panel" id="detailPanel">
  <div>
    <span class="detail-cat" id="dCategory"></span>
    <div class="detail-title" id="dName"></div>
    <button class="close-btn" onclick="closeDetail()">✕</button>
  </div>

  <div class="detail-addr" id="dAddress"></div>
  <div class="detail-coord" id="dCoord"></div>

  <div class="status-group">
    <button class="st-btn" onclick="setDetailStatus('PENDING')">미검수</button>
    <button class="st-btn" onclick="setDetailStatus('VERIFIED')">확인완료</button>
    <button class="st-btn" onclick="setDetailStatus('INVALID')">불일치</button>
  </div>

  <textarea class="note-input" id="dNote" placeholder="현장 메모"></textarea>

  <div class="detail-actions">
    <a class="btn btn-outline" id="dNaviLink" href="#" target="_blank">카카오맵 길찾기</a>
    <button class="btn btn-primary" onclick="saveDetail()">DB에 저장</button>
  </div>
</div>

<div class="modal-backdrop" id="createModal">
  <div class="modal">
    <h3>신규 시설 등록</h3>

    <div class="field">
      <label>카테고리</label>
      <select id="newCat">
        <option value="공중화장실">공중화장실</option>
        <option value="AED">AED</option>
        <option value="졸음쉼터">졸음쉼터</option>
        <option value="한파쉼터">한파쉼터</option>
        <option value="무더위쉼터">무더위쉼터</option>
      </select>
    </div>

    <div class="field">
      <label>시설명</label>
      <input id="newName">
    </div>

    <div class="field">
      <label>주소</label>
      <input id="newAddr">
    </div>

    <div class="field">
      <label>비고</label>
      <input id="newNote">
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeCreateModal()">취소</button>
      <button class="btn btn-primary" onclick="submitCreate()">등록하기</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://capstone-map-app.onrender.com";

let map, clusterer, geocoder, places;
let currentCategory = "ALL";
let selectedItem = null;
let selectedStatus = "PENDING";
let isAddMode = false;
let pendingLatLng = null;
let fetchTimer = null;

window.addEventListener("load", function() {
  const badge = document.getElementById("countBadge");

  if (!window.kakao || !kakao.maps) {
    badge.textContent = "지도 API 오류";
    console.error("카카오맵 SDK 로딩 실패");
    return;
  }

  const container = document.getElementById("map");

  map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.1458,127.0664),
    level: 5
  });

  clusterer = new kakao.maps.MarkerClusterer({
    map: map,
    averageCenter: true,
    minLevel: 5
  });

  geocoder = new kakao.maps.services.Geocoder();
  places = new kakao.maps.services.Places();

  kakao.maps.event.addListener(map,"idle",function(){
    clearTimeout(fetchTimer);
    fetchTimer = setTimeout(fetchLocations,300);
  });

  kakao.maps.event.addListener(map,"click",function(e){
    if(!isAddMode)return;

    pendingLatLng = e.latLng;

    geocoder.coord2Address(
      pendingLatLng.getLng(),
      pendingLatLng.getLat(),
      function(res,status){
        const addr =
          status === kakao.maps.services.Status.OK && res[0]
          ? (res[0].road_address
            ? res[0].road_address.address_name
            : res[0].address.address_name)
          : "";

        document.getElementById("newAddr").value = addr;
        document.getElementById("newName").value = "";
        document.getElementById("newNote").value = "";
        document.getElementById("createModal").classList.add("open");
      }
    );
  });

  fetchLocations();
});

async function fetchLocations(){
  if(!map)return;

  const bounds = map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  const params = new URLSearchParams({
    sw_lat:sw.getLat(),
    sw_lng:sw.getLng(),
    ne_lat:ne.getLat(),
    ne_lng:ne.getLng(),
    category:currentCategory,
    status:document.getElementById("statusFilter").value,
    keyword:document.getElementById("searchInput").value.trim(),
    limit:800
  });

  const badge = document.getElementById("countBadge");

  try{
    const response = await fetch(
      `${API_BASE}/api/locations?${params.toString()}`
    );

    if(!response.ok)throw new Error("서버 응답 오류");

    const data = await response.json();

    if(!Array.isArray(data))throw new Error("데이터 형식 오류");

    renderMarkers(data);
    badge.textContent = `현재 화면 ${data.length}건`;

  }catch(err){
    console.error("시설 조회 실패:",err);
    badge.textContent = "연결 오류";
  }
}

function renderMarkers(items){
  clusterer.clear();

  const markers = items
    .filter(item =>
      Number.isFinite(Number(item.lat)) &&
      Number.isFinite(Number(item.lng))
    )
    .map(item => {
      const marker = new kakao.maps.Marker({
        position:new kakao.maps.LatLng(
          Number(item.lat),
          Number(item.lng)
        ),
        title:item.name || "시설"
      });

      kakao.maps.event.addListener(marker,"click",function(){
        openDetail(item);
      });

      return marker;
    });

  clusterer.addMarkers(markers);
}

function selectCategory(el){
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  currentCategory = el.dataset.cat;
  fetchLocations();
}

function handleSearch(){
  const kw = document.getElementById("searchInput").value.trim();

  if(!kw){
    fetchLocations();
    return;
  }

  places.keywordSearch(kw,function(data,status){
    if(status === kakao.maps.services.Status.OK && data.length){
      map.setCenter(new kakao.maps.LatLng(data[0].y,data[0].x));
      map.setLevel(4);
    }else{
      fetchLocations();
    }
  });
}

/* GPS 내 위치 기능 */
function moveToCurrentLocation(){

  if(!navigator.geolocation){
    alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
    return;
  }

  if(!map){
    alert("지도가 아직 준비되지 않았습니다.");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(pos){

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      console.log("GPS 위도:",lat);
      console.log("GPS 경도:",lng);

      if(!Number.isFinite(lat) || !Number.isFinite(lng) ||
         lat < -90 || lat > 90 || lng < -180 || lng > 180){
        alert("GPS 좌표가 올바르지 않습니다.");
        return;
      }

      const currentPosition =
        new kakao.maps.LatLng(lat,lng);

      map.relayout();
      map.setCenter(currentPosition);
      map.setLevel(4);

      setTimeout(function(){
        map.relayout();
        map.setCenter(currentPosition);
      },300);

      console.log("현재 위치로 지도 이동 완료");

    },

    function(error){

      console.error("GPS 오류:",error.code,error.message);

      let message = "위치 정보를 가져오지 못했습니다.";

      if(error.code === 1){
        message = "위치 권한이 거부되었습니다.";
      }else if(error.code === 2){
        message = "현재 위치를 확인할 수 없습니다.";
      }else if(error.code === 3){
        message = "위치 요청 시간이 초과되었습니다.";
      }

      alert(message + "\n" + error.message);
    },

    {
      enableHighAccuracy:false,
      timeout:20000,
      maximumAge:0
    }
  );
}

function openDetail(item){
  selectedItem = item;

  document.getElementById("dCategory").textContent = item.category || "기타";
  document.getElementById("dName").textContent = item.name || "이름 없음";
  document.getElementById("dAddress").textContent = item.address || "등록된 주소 없음";
  document.getElementById("dCoord").textContent = `좌표: ${item.lat}, ${item.lng}`;
  document.getElementById("dNote").value = item.note || "";

  document.getElementById("dNaviLink").href =
    `https://map.kakao.com/link/to/${encodeURIComponent(item.name || "시설")},${item.lat},${item.lng}`;

  document.getElementById("detailPanel").classList.add("open");
}

function closeDetail(){
  document.getElementById("detailPanel").classList.remove("open");
  selectedItem = null;
}

function setDetailStatus(st){
  selectedStatus = st;

  document.querySelectorAll(".st-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  event?.currentTarget?.classList.add("active");
}

async function saveDetail(){
  if(!selectedItem)return;

  try{
    const response = await fetch(
      `${API_BASE}/api/locations/${encodeURIComponent(selectedItem.id)}`,
      {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          status:selectedStatus,
          note:document.getElementById("dNote").value
        })
      }
    );

    if(!response.ok)throw new Error("저장 실패");

    alert("검수 내용이 저장되었습니다.");
    fetchLocations();

  }catch(err){
    console.error(err);
    alert("저장 실패: 서버 연결을 확인하세요.");
  }
}

function toggleAddMode(){
  isAddMode = !isAddMode;

  document.getElementById("addBanner").style.display =
    isAddMode ? "block" : "none";

  document.getElementById("addModeBtn").textContent =
    isAddMode ? "등록 취소" : "+ 시설 등록";
}

function closeCreateModal(){
  document.getElementById("createModal").classList.remove("open");
  if(isAddMode)toggleAddMode();
}

async function submitCreate(){

  const name = document.getElementById("newName").value.trim();

  if(!name)return alert("시설명을 입력하세요.");
  if(!pendingLatLng)return alert("지도에서 등록 위치를 먼저 선택하세요.");

  const payload = {
    category:document.getElementById("newCat").value,
    name:name,
    lat:pendingLatLng.getLat(),
    lng:pendingLatLng.getLng(),
    address:document.getElementById("newAddr").value.trim(),
    note:document.getElementById("newNote").value.trim()
  };

  try{
    const response = await fetch(
      `${API_BASE}/api/locations`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      }
    );

    if(!response.ok)throw new Error("등록 실패");

    alert("신규 시설이 등록되었습니다.");
    closeCreateModal();
    fetchLocations();

  }catch(err){
    console.error(err);
    alert("등록 실패: 서버 연결 또는 CORS 설정을 확인하세요.");
  }
}
</script>

</body>
</html>
